services:
  omega:
    build:
      context: .
    container_name: omega2-plugin-spike
    init: true
    stdin_open: true
    tty: true
    command:
      - provider=Test
      - commchannel=test
      - embeddingprovider=Local
    environment:
      IMPORT_KB_ON_START: "0"
    depends_on:
      - mcp-mock
    volumes:
      - ./config/config.yaml:/PeTTa/repos/Omega/config/config.yaml:ro
      - ./config/plugins.yaml:/PeTTa/repos/Omega/config/plugins.yaml:ro
      - ./config/mcp.json:/PeTTa/repos/Omega/config/mcp.json:ro
      - ../../plugins/mcp/mcp.metta:/opt/asi-omega/plugins/mcp/mcp.metta:ro
      - ../../plugins/mcp/mcp_client.py:/opt/asi-omega/plugins/mcp/mcp_client.py:ro
      - ../../plugins/wschat/asi_wschat.py:/opt/asi-omega/plugins/wschat/asi_wschat.py:ro
      - ../../plugins/wschat/chat_attachments.py:/opt/asi-omega/plugins/wschat/chat_attachments.py:ro
      - ../../plugins/wschat/wschat.metta:/opt/asi-omega/plugins/wschat/wschat.metta:ro
      - ../../plugins/asi_create_context/asi_create_context.metta:/opt/asi-omega/plugins/asi_create_context/asi_create_context.metta:ro
      - ../../plugins/asi_create_context/context_file.py:/opt/asi-omega/plugins/asi_create_context/context_file.py:ro

  mcp-mock:
    image: omega2-spike-omega:latest
    init: true
    entrypoint:
      - python3
      - /opt/asi-omega/spike/mcp_mock.py
    volumes:
      - ./mcp_mock.py:/opt/asi-omega/spike/mcp_mock.py:ro
